<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How-To · Academy Creator Lab</title>
  <style>
    :root { --text:#f8f8f8; --muted:#a5a5ad; --accent:#1df3f2; --line:rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; color:var(--text); background:linear-gradient(180deg,#030303 0%,#080808 50%,#030303 100%); }
    main { width:min(1480px,calc(100% - 40px)); margin:0 auto; padding:22px 0 56px; }
    header { display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; margin-bottom:20px; }
    .logo { width:clamp(176px,18vw,260px); display:block; }
    .main-nav { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .nav-link { border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:10px 14px; color:var(--text); background:rgba(255,255,255,.06); text-decoration:none; font-size:14px; font-weight:800; }
    .nav-link.active { background:var(--accent); border-color:var(--accent); color:#020202; }
    .hero { border:1px solid var(--line); border-radius:14px; padding:24px; background:linear-gradient(125deg, rgba(255,255,255,.07), rgba(29,243,242,.08) 42%, rgba(0,0,0,.4)); margin-bottom:16px; }
    h1 { margin:0 0 10px; font-size:clamp(30px,4vw,52px); }
    p { margin:0; color:#d7dde0; line-height:1.6; }
    @media (max-width:680px){ main{width:calc(100% - 24px);} header{grid-template-columns:1fr;} .main-nav{justify-content:flex-start;} }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="index.html"><img class="logo" src="media/as-academy-creator-lab-logo.png" alt="Academy Creator Lab" /></a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a class="nav-link" href="lab.html">Lab</a>
        <a class="nav-link" href="stats.html">Stats</a>
        <a class="nav-link active" href="how-to.html">How-To</a>
      </nav>
    </header>
    <section class="hero">
      <h1>How-To</h1>
      <p>Hier entsteht die Anleitungssammlung für Workflows, Formate und Produktionsprozesse.</p>
    </section>
  </main>
</body>
</html>
